<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="24" fill="#047857"/>
  
  <!-- Graduation cap icon -->
  <g transform="translate(64, 58)" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main cap shape (diamond) -->
    <path d="M -28 -8 L 0 -20 L 28 -8 L 0 4 Z" fill="white"/>
    
    <!-- Left side -->
    <path d="M -18 4 L -18 18 Q -18 26 0 30"/>
    
    <!-- Right side -->
    <path d="M 18 4 L 18 18 Q 18 26 0 30"/>
    
    <!-- Tassel line -->
    <line x1="28" y1="-8" x2="28" y2="8"/>
    
    <!-- Tassel end -->
    <circle cx="28" cy="12" r="3.5" fill="white" stroke="white" stroke-width="2"/>
  </g>
</svg>